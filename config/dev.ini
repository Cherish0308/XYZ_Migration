# Development environment configuration
# Overrides base.ini values for local development

[app]
env = dev
log_level = DEBUG

[s3]
# Override with environment variable: ${S3_BUCKET}
# Fallback for local development
bucket = xyz-migration-dev

[redshift]
# Override with environment variables for security
# ${REDSHIFT_HOST}, ${REDSHIFT_DATABASE}, etc.
host = localhost
database = xyz_dev
user = dev_user
# Password must be provided via environment variable
iam_role_arn = arn:aws:iam::123456789012:role/RedshiftDevRole

[feature_flags]
dry_run = true
