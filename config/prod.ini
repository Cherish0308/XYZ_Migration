# Production environment configuration
# All sensitive values must come from environment variables

[app]
env = prod
log_level = WARNING

[s3]
# Production bucket - must be provided via env var ${S3_BUCKET}
bucket = ${S3_BUCKET}

[redshift]
# Production cluster - all values from environment variables
host = ${REDSHIFT_HOST}
database = ${REDSHIFT_DATABASE}
user = ${REDSHIFT_USER}
iam_role_arn = ${REDSHIFT_IAM_ROLE_ARN}

[feature_flags]
dry_run = false
enable_validation = true
enable_dq_checks = true
