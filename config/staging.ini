# Staging environment configuration
# Pre-production testing environment

[app]
env = staging
log_level = INFO

[s3]
# Production-like bucket structure
bucket = xyz-migration-staging

[redshift]
# Staging cluster configuration
host = xyz-staging.redshift.amazonaws.com
database = xyz_staging
user = staging_user
iam_role_arn = arn:aws:iam::123456789012:role/RedshiftStagingRole

[feature_flags]
dry_run = false
enable_validation = true
enable_dq_checks = true
