# Base configuration - common across all environments
# Environment-specific configs will override these values

[app]
app_name = xyz-pricing-migration
log_level = INFO

[s3]
# Prefix structure for S3 organization
raw_prefix = raw
validated_prefix = validated
transformed_prefix = transformed
error_prefix = error
recon_prefix = recon

[redshift]
# Default Redshift connection settings
port = 5439

[feature_flags]
# Feature toggles for safe deployment
dry_run = false
enable_validation = true
enable_dq_checks = true
